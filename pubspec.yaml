name: entrepreneur_toolkit
description: "A comprehensive mobile app for entrepreneurs with business planning, financial tools, market research, networking, and learning resources."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # HTTP and API
  http: ^1.1.0
  
  # UI and Animations
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_markdown: ^0.6.18
  
  # Charts and Graphs
  fl_chart: ^0.65.0
  
  # Real-time Communication
  web_socket_channel: ^2.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  image_picker: ^1.0.4
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  flutterfire_cli: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
